name: Feature Request
description: Propose a capability or improvement. Defects belong in the Bug Report form; security vulnerabilities must not be reported here.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement to Pi Jev Helm.

        **Before you continue**

        - This form is for **capability proposals** — new behavior, changed
          behavior, or quality-of-life improvements. If something is broken or
          behaves contrary to its documented behavior, use the
          [Bug Report](https://github.com/Z761293629/pi-jev-helm/issues/new?template=bug_report.yml)
          form instead, so
          defect triage stays separate from roadmap discussion.
        - **Security vulnerabilities must not be reported here, even redacted.**
          Use [GitHub Private Vulnerability Reporting](https://github.com/Z761293629/pi-jev-helm/security/advisories/new)
          instead; see the
          [security policy](https://github.com/Z761293629/pi-jev-helm/blob/main/SECURITY.md).
        - Pi Jev Helm is a **Public Preview**: support is best-effort and there
          is no response-time commitment.

        **Sanitize everything you paste.** A proposal must not contain API
        keys, raw sensitive prompts, or unsanitized upstream payloads. Replace
        each redacted item with an obvious placeholder such as `<redacted>`.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        What are you trying to accomplish, and what is missing or awkward
        today? Describe the problem from your point of view — not the solution
        and not a defect report.
    validations:
      required: true

  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: |
        What should happen instead? Be concrete about the user-visible
        behavior you expect, including how it interacts with Automatic
        Routing, Route Overrides, and the Baseline Model.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: |
        How do you work around this today? What other approaches did you
        consider, and why is the proposed behavior preferable?
    validations:
      required: false

  - type: checkboxes
    id: sensitive-content
    attributes:
      label: Sensitive-content checklist
      description: Reports containing prohibited content may be edited or removed by maintainers.
      options:
        - label: This is a capability proposal, not a defect report; bugs belong in the Bug Report form.
          required: true
        - label: My proposal contains no API keys, tokens, or other credentials.
          required: true
        - label: My proposal contains no raw sensitive prompts; any quoted message content is synthetic or reduced to structure with placeholders.
          required: true
        - label: My proposal contains no unsanitized upstream payloads (OpenRouter request or response bodies, provider error text, headers, or captured traffic).
          required: true
        - label: I understand Pi Jev Helm is a Public Preview and support is best-effort, with no response-time commitment.
          required: true
