name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic default suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every declared Node.js runtime must produce its own evidence: one
      # failing leg must not cancel the other before it finishes.
      fail-fast: false
      matrix:
        # 22.19.0 is the declared minimum (package.json engines); 24 is the
        # current Node.js runtime. Keep this in sync with test/ci-contract.
        node-version: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  pi-compatibility:
    name: Pi public-API compatibility matrix
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:pi-matrix
